name: CI

on: 
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'nimbus/server/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
            frontend:
              - 'nimbus/**'
              - '!nimbus/server/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
            workflows:
              - '.github/workflows/**'
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run format:check

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace server
      - run: npm run typecheck --workspace server
      - run: npm run build --workspace server

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace nimbus
      - run: npm run typecheck --workspace nimbus
      - run: npm run build --workspace nimbus
      - run: npm run test --workspace nimbus

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  ci-ok:
    needs: [changes, actionlint, frontend, backend, format]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{contains(needs.*.result, 'failure')}}" == "true" ]]; then
            echo "A required job failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job cancelled"
            exit 1
          fi
          echo "All required jobs passed or were correctly skipped"
